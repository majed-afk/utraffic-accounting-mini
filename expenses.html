<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTraffic Mini Accounting | المصروفات</title>
    <meta name="description" content="صفحة المصروفات في البرنامج المحاسبي المصغر لشركة UTraffic.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="expenses">
    <div class="app-shell">
        <header class="topbar site-topbar">
            <div class="brand-block">
                <div class="brand-logo-frame">
                    <img src="assets/utraffic-logo.png" alt="شعار UTraffic">
                </div>
                <div class="brand-copy">
                    <h1>المصروفات</h1>
                </div>
            </div>
            <nav class="page-nav" aria-label="التنقل">
                <a href="index.html">الرئيسية</a>
                <a href="invoices.html">الفواتير</a>
                <a href="quotes.html">عروض الأسعار</a>
                <a href="customers.html">العملاء</a>
                <a class="active" href="expenses.html">المصروفات</a>
                <a href="statements.html">كشف الحساب</a>
                <a href="reports.html">القوائم المالية</a>
            </nav>
        </header>

        <section class="hero-grid">
            <article class="hero-panel hero-panel-primary">
                <h2>تسجيل المصروفات</h2>
            </article>

            <article class="hero-panel hero-panel-highlight">
                <div class="summary-head">
                    <h3>المؤشرات</h3>
                </div>
                <div class="summary-grid">
                    <div class="summary-card">
                        <span>إجمالي المصروفات</span>
                        <strong id="expensesMetricTotal">0</strong>
                    </div>
                    <div class="summary-card">
                        <span>هذا الشهر</span>
                        <strong id="expensesMetricMonth">0</strong>
                    </div>
                    <div class="summary-card">
                        <span>عدد السجلات</span>
                        <strong id="expensesMetricCount">0</strong>
                    </div>
                    <div class="summary-card">
                        <span>آخر تحديث</span>
                        <strong id="expensesUpdatedAt">الآن</strong>
                    </div>
                </div>
            </article>
        </section>

        <main class="workspace-grid">
            <section class="panel-card editor-card">
                <div class="panel-head">
                    <div>
                        <h2 id="expenseFormTitle">إضافة مصروف جديد</h2>
                    </div>
                </div>

                <form id="expenseForm" class="billing-form">
                    <input type="hidden" id="expenseEditId" value="">
                    <div class="form-section">
                        <div class="section-title">
                            <h3>بيانات المصروف</h3>
                        </div>
                        <div class="fields-grid fields-grid-4">
                            <label class="field">
                                <span>التاريخ</span>
                                <input id="expenseDate" type="date">
                            </label>
                            <label class="field">
                                <span>التصنيف</span>
                                <select id="expenseCategory">
                                    <option value="operations">تشغيل</option>
                                    <option value="ads">إعلانات</option>
                                    <option value="tools">اشتراكات وأدوات</option>
                                    <option value="salary">رواتب وتعاون</option>
                                    <option value="travel">تنقلات</option>
                                    <option value="other">أخرى</option>
                                </select>
                            </label>
                            <label class="field">
                                <span>الجهة</span>
                                <input id="expenseVendor" type="text" placeholder="اسم الجهة">
                            </label>
                            <label class="field">
                                <span>المبلغ</span>
                                <input id="expenseAmount" type="number" min="0" step="0.01" placeholder="0">
                            </label>
                        </div>
                        <label class="field field-full">
                            <span>ملاحظات</span>
                            <textarea id="expenseNotes" rows="4" placeholder="تفاصيل المصروف"></textarea>
                        </label>
                        <div class="action-bar action-bar-start">
                            <button type="submit" id="expenseSubmitBtn" class="btn btn-primary">حفظ المصروف</button>
                            <button type="button" id="expenseCancelEdit" class="btn btn-ghost" style="display:none">إلغاء التعديل</button>
                        </div>
                    </div>
                </form>
            </section>

            <section class="panel-card">
                <div class="panel-head">
                    <h2>السجلات</h2>
                    <span class="panel-hint" id="expensesCountHint">0 سجل</span>
                </div>
                <div class="table-shell">
                    <table class="app-table">
                        <thead>
                            <tr>
                                <th>التاريخ</th>
                                <th>التصنيف</th>
                                <th>الجهة</th>
                                <th>المبلغ</th>
                                <th>الملاحظات</th>
                                <th>إجراء</th>
                            </tr>
                        </thead>
                        <tbody id="expensesTableBody"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <div id="toast" class="toast" aria-live="polite"></div>
    <script src="js/main.js"></script>
</body>
</html>

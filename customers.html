<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTraffic Mini Accounting | العملاء</title>
    <meta name="description" content="صفحة العملاء في البرنامج المحاسبي المصغر لشركة UTraffic.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="customers">
    <div class="app-shell">
        <header class="topbar site-topbar">
            <div class="brand-block">
                <div class="brand-logo-frame">
                    <img src="assets/utraffic-logo.png" alt="شعار UTraffic">
                </div>
                <div class="brand-copy">
                    <h1>العملاء</h1>
                </div>
            </div>
            <nav class="page-nav" aria-label="التنقل">
                <a href="index.html">الرئيسية</a>
                <a href="invoices.html">الفواتير</a>
                <a href="quotes.html">عروض الأسعار</a>
                <a class="active" href="customers.html">العملاء</a>
                <a href="expenses.html">المصروفات</a>
                <a href="statements.html">كشف الحساب</a>
                <a href="reports.html">القوائم المالية</a>
            </nav>
        </header>

        <section class="hero-grid">
            <article class="hero-panel hero-panel-primary">
                <h2>إدارة العملاء</h2>
            </article>

            <article class="hero-panel hero-panel-highlight">
                <div class="summary-head">
                    <h3>المؤشرات</h3>
                </div>
                <div class="summary-grid">
                    <div class="summary-card">
                        <span>عدد العملاء</span>
                        <strong id="customersMetricCount">0</strong>
                    </div>
                    <div class="summary-card">
                        <span>الفواتير المرتبطة</span>
                        <strong id="customersMetricInvoices">0</strong>
                    </div>
                    <div class="summary-card">
                        <span>المستحقات</span>
                        <strong id="customersMetricReceivables">0</strong>
                    </div>
                    <div class="summary-card">
                        <span>آخر تحديث</span>
                        <strong id="customersUpdatedAt">الآن</strong>
                    </div>
                </div>
            </article>
        </section>

        <main class="workspace-grid">
            <section class="panel-card editor-card">
                <div class="panel-head">
                    <div>
                        <h2>إضافة أو تعديل عميل</h2>
                    </div>
                </div>

                <form id="customerForm" class="billing-form">
                    <input id="customerId" type="hidden">
                    <div class="form-section">
                        <div class="section-title">
                            <h3>بيانات العميل</h3>
                        </div>
                        <div class="fields-grid fields-grid-2">
                            <label class="field">
                                <span>اسم العميل</span>
                                <input id="customerName" type="text" placeholder="اسم العميل">
                            </label>
                            <label class="field">
                                <span>الجهة أو المسؤول</span>
                                <input id="customerTitle" type="text" placeholder="اسم الجهة">
                            </label>
                            <label class="field">
                                <span>الهاتف</span>
                                <input id="customerPhone" type="text" placeholder="+966 5X XXX XXXX">
                            </label>
                            <label class="field">
                                <span>البريد الإلكتروني</span>
                                <input id="customerEmail" type="email" placeholder="client@example.com">
                            </label>
                        </div>
                        <label class="field field-full">
                            <span>العنوان</span>
                            <textarea id="customerAddress" rows="4" placeholder="المدينة - الدولة - العنوان"></textarea>
                        </label>
                        <label class="field field-full">
                            <span>الرقم الضريبي</span>
                            <input id="customerVatNumber" type="text" placeholder="مثال: 300000000000003" dir="ltr">
                        </label>
                        <div class="action-bar action-bar-start">
                            <button type="submit" class="btn btn-primary">حفظ العميل</button>
                            <button type="button" class="btn btn-secondary" id="clearCustomerBtn">تفريغ النموذج</button>
                        </div>
                    </div>
                </form>
            </section>

            <section class="panel-card">
                <div class="panel-head">
                    <h2>العملاء</h2>
                    <span class="panel-hint" id="customersCountHint">0 عميل</span>
                </div>
                <div id="customersList" class="entity-list"></div>
            </section>
        </main>
    </div>

    <div id="toast" class="toast" aria-live="polite"></div>
    <script src="js/main.js"></script>
</body>
</html>
